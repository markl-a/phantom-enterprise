name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .[dev]
      - run: python -m pip wheel . --no-deps -w dist-smoke
      - run: python -m ruff check .
      - run: python -m pytest -ra -q
      - name: deterministic enterprise smoke
        run: |
          python -m code_qa.cli demo-loop --out demo-loop-smoke
          python -m code_qa.cli connector-matrix --out connector-matrix-smoke
          python -m code_qa.cli knowledge-scenario --out knowledge-scenario-smoke
      - name: release-prep gate
        run: python -m pytest code_qa/tests/test_release_prep_contract.py -q
