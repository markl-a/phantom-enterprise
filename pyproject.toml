[project]
name = "phantom-enterprise"
version = "0.1.0a0"
description = "Enterprise connector pack for phantom-mesh (LDAP/SSO, VPN routing, on-prem Git, MES/ERP, Apple Silicon HA)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Mark Light", email = "m4932981@gmail.com" }]
keywords = ["enterprise", "on-prem", "connectors", "code-qa", "phantom-mesh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Documentation",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/markl-a/phantom-enterprise"
Repository = "https://github.com/markl-a/phantom-enterprise"
Issues = "https://github.com/markl-a/phantom-enterprise/issues"
Changelog = "https://github.com/markl-a/phantom-enterprise/blob/main/CHANGELOG.md"

[project.scripts]
phantom-enterprise = "code_qa.cli:main"
phantom-enterprise-demo-loop = "code_qa.demo_loop:main"
phantom-enterprise-connector-matrix = "code_qa.connector_matrix:main"
phantom-enterprise-knowledge-scenario = "code_qa.knowledge_lookup_scenario:main"
phantom-enterprise-mcp = "code_qa.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]
mcp = ["mcp>=1,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ldap_sso*", "vpn_aware_routing*", "on_prem_gitlab*", "mes_connector*", "erp_connector*", "confluence_jira*", "apple_silicon_ha*", "code_qa*"]

[tool.pytest.ini_options]
testpaths = [
    "ldap_sso/tests",
    "vpn_aware_routing/tests",
    "on_prem_gitlab/tests",
    "confluence_jira/tests",
    "code_qa/tests",
    "apple_silicon_ha/tests",
]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "live: requires PHANTOM_ENTERPRISE_LIVE=1 and external services",
]
